<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Спасибо за регистрацию!</title>
  <style>
   
body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0d1b2a, #1b263b, #0d1b2a);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    color: #eee;
    min-height: 100vh;
    transition: all 0.3s ease;
    overflow-x: hidden;
}

@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}


body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
        radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 60% 20%, rgba(0, 212, 255, 0.06) 0%, transparent 50%);
    animation: floatingParticles 20s ease-in-out infinite;
    pointer-events: none;
    z-index: -1;
}

@keyframes floatingParticles {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    33% { transform: translateY(-20px) rotate(1deg); }
    66% { transform: translateY(10px) rotate(-1deg); }
}


.confirmation {
    max-width: 500px;
    margin: 120px auto;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(15px);
    padding: 50px 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(0, 212, 255, 0.2);
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(50px) scale(0.9);
    animation: confirmationAppear 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards;
}


@keyframes confirmationAppear {
    0% {
        opacity: 0;
        transform: translateY(50px) scale(0.9);
    }
    60% {
        opacity: 0.8;
        transform: translateY(-10px) scale(1.02);
    }
    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


.confirmation::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.15), transparent);
    animation: borderGlow 3s ease-in-out infinite;
}

@keyframes borderGlow {
    0% { left: -100%; }
    50% { left: 100%; }
    100% { left: 100%; }
}

.confirmation:hover {
    transform: translateY(-8px);
    box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(0, 212, 255, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    border-color: rgba(0, 212, 255, 0.4);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}


.confirmation h1 {
    color: #00d4ff;
    font-size: 2.4em;
    margin-bottom: 25px;
    text-shadow: 
        0 0 20px rgba(0, 212, 255, 0.6),
        0 0 40px rgba(0, 212, 255, 0.3);
    opacity: 0;
    transform: translateY(-20px);
    animation: titleAppear 1s ease 0.8s forwards;
    position: relative;
}

@keyframes titleAppear {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.confirmation h1:hover {
    text-shadow: 
        0 0 30px rgba(0, 212, 255, 0.8),
        0 0 60px rgba(0, 212, 255, 0.5);
    transform: scale(1.05);
    transition: all 0.3s ease;
}


.confirmation h1::before {
    content: '✓';
    display: inline-block;
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #00d4ff, #00ffff);
    border-radius: 50%;
    line-height: 60px;
    font-size: 30px;
    color: #0d1b2a;
    margin-bottom: 20px;
    margin-right: 0;
    display: block;
    margin: 0 auto 20px;
    box-shadow: 
        0 0 20px rgba(0, 212, 255, 0.5),
        0 8px 16px rgba(0, 0, 0, 0.3);
    animation: checkmarkBounce 1.5s ease 1.2s forwards;
    transform: scale(0);
}

@keyframes checkmarkBounce {
    0% { transform: scale(0); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}


.confirmation p {
    color: #eee;
    font-size: 1.15em;
    line-height: 1.6em;
    margin-bottom: 0;
    opacity: 0;
    transform: translateY(20px);
    animation: textAppear 1s ease 1s forwards;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}

@keyframes textAppear {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.confirmation p:hover {
    color: #fff;
    transition: color 0.3s ease;
}


.back-btn {
    display: inline-block;
    margin-top: 35px;
    padding: 15px 30px;
    background: linear-gradient(135deg, #00d4ff, #00b8e6);
    color: #0d1b2a;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
    font-size: 1.05em;
    letter-spacing: 1.5px;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 
        0 8px 20px rgba(0, 212, 255, 0.3),
        0 0 0 1px rgba(0, 212, 255, 0.2);
    opacity: 0;
    transform: translateY(30px);
    animation: buttonAppear 1s ease 1.4s forwards;
}

@keyframes buttonAppear {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}


.back-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #00ffff, #00d4ff);
    transition: left 0.5s ease;
    z-index: -1;
}

.back-btn:hover {
    background: #00ffff;
    transform: translateY(-4px);
    box-shadow: 
        0 15px 30px rgba(0, 212, 255, 0.4),
        0 0 0 1px rgba(0, 255, 255, 0.4);
    letter-spacing: 2px;
}

.back-btn:hover::before {
    left: 0;
}

.back-btn:active {
    transform: translateY(-2px);
    transition: transform 0.1s ease;
}


.back-btn::after {
    content: '→';
    margin-left: 8px;
    transition: transform 0.3s ease;
}

.back-btn:hover::after {
    transform: translateX(5px);
}


@media (max-width: 600px) {
    .confirmation {
        margin: 80px 20px;
        padding: 40px 30px;
    }
    
    .confirmation h1 {
        font-size: 2em;
    }
    
    .confirmation p {
        font-size: 1.05em;
    }
    
    .back-btn {
        padding: 12px 25px;
        font-size: 1em;
    }
}


@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

.confirmation:hover h1::before {
    animation: pulse 2s ease infinite;
}


html {
    scroll-behavior: smooth;
}


* {
    box-sizing: border-box;
}

*:focus {
    outline: none;
}
  </style>
</head>
<body>
  <div class="confirmation">
    <h1>Спасибо!</h1>
    <p>Ваши данные успешно сохранены.<br>Camera AI позаботится о вашей чистоте.</p>
    <a href="/" class="back-btn">Вернуться на главную</a>
  </div>
</body>
</html>
